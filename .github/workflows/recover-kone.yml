name: Recover KONE MCP

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-kone.yml

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Start installed MCP tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-ScheduledTask -TaskName 'ChatGPTMcpStack'
          Start-ScheduledTask -TaskName 'ChatGPTMcpStackCaddy'
          Start-Sleep -Seconds 3
          $cfg = Get-Content "$env:LOCALAPPDATA\ChatGPTMcpStack\stack-config.json" -Raw | ConvertFrom-Json
          $health = Invoke-RestMethod "http://127.0.0.1:$($cfg.port)/health" -TimeoutSec 5
          if ($health.status -ne 'ok') { throw 'MCP health failed' }
          if (-not (Get-NetTCPConnection -State Listen -LocalPort ([int]$cfg.caddy_https_port) -ErrorAction SilentlyContinue)) { throw 'MCP edge not listening' }
          Write-Host 'LIVE_MCP_STACK_RESTORED'
